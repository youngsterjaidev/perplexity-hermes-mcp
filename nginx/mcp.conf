# Nginx reverse proxy config for the MCP connector
# Replace mcp.yourdomain.com with your actual domain
# Run: sudo certbot --nginx -d mcp.yourdomain.com

server {
    listen 80;
    server_name mcp.yourdomain.com;

    # Let Certbot handle HTTPS redirect after setup
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mcp.yourdomain.com;

    # Certbot will populate these after: sudo certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Limit request body to avoid abuse
    client_max_body_size 1m;

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for Streamable HTTP / SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeout for long-running Hermes tasks
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
